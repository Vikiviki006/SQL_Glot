# config/rules.yaml -- the rulebook
#
# Every vocabulary that decides what this compiler *accepts* lives here rather
# than in source: which specification versions it reads, which operations a
# step may use under each category, which Oracle types have a PostgreSQL
# meaning, which words PostgreSQL reserves. A deployment ships this file to
# change the rules; it does not rebuild the tool.
#
# Resolution order, applied once at startup by `load_rulebook` in
# src/transpiler.py:
#
#   1. $TRANSPILER_RULES_FILE, when set -- an explicit path. If it does not
#      exist that is an error, not a reason to fall back, for the same reason
#      an explicit --catalog is never searched for elsewhere: a typo in the
#      path must be reported rather than quietly replaced by other rules.
#   2. otherwise PROJECT_ROOT/config/rules.yaml, when this file is present.
#   3. otherwise the built-in defaults in src/transpiler.py, so that deleting
#      this file leaves the tool working rather than broken.
#
# A file that exists but is incomplete, mistyped or malformed raises
# RuleBookError. It never falls back. A rulebook that could not be read is one
# the deployment believes it shipped, and compiling against a vocabulary
# nobody approved is precisely the stale-hand-written-list failure AGENT.md
# warns about -- the rule applies to rulebooks too.
#
# Every key below mirrors one vocabulary constant in src/transpiler.py, and
# holds exactly what the built-in default held, so shipping this file changes
# nothing until someone edits it. Keep a vocabulary and the gate in step:
# `categories.value` lists `value_ops` plus `drop_ops`, for instance. Nothing
# enforces that pairing, because a mismatch cannot smuggle a rule through --
# `_validate_step` gates first and the compile paths re-check each operation
# (VALUE_OPERATION_UNIMPLEMENTED) -- so an inconsistency can only over-block,
# never under-block.


# ---------------------------------------------------------------------------
# What the specification may say
# ---------------------------------------------------------------------------

# The schemaVersion values validate_spec accepts. Anything else blocks the
# whole specification (SPEC_SCHEMA_VERSION_UNSUPPORTED) rather than being
# compiled against a schema this build may not understand.
supported_schema_versions:
  - "5.0.0"
  - "5.1.0"

# The categories a step may declare. Anything else is a compile-time block
# (STEP_CATEGORY_UNKNOWN), because a category this compiler does not
# implement would otherwise be dropped from the projection with no record.
known_categories:
  - value
  - derived
  - structural
  - escape
  - row-selection
  - column-split
  - lookup
  - set
  - cardinality
  - relational
  - pivot
  - change-aware
  - key-declaration


# ---------------------------------------------------------------------------
# Which operations each category accepts -- the gate
# ---------------------------------------------------------------------------
#
# `_validate_step` reads this, not the individual operation vocabularies
# below: it is the one place that answers "may a step do that?". An operation
# missing from its category blocks (STEP_OPERATION_UNKNOWN) instead of falling
# through to the compiler, which is what keeps an unimplemented shape from
# being compiled into something approximate.
#
# `value` allows `drop` as well as every entry in `value_ops`, because
# `drop` is a value step in the specification -- it removes the column's
# value and lets the column disappear -- and DROP_OPS is read on its own by
# the sensitive-handling check and the projection loop.
#
# `set`, `cardinality` and `relational` have no separate operation
# vocabulary in source; this key is their complete definition.
categories:
  value:
    - cast
    - trim
    - substring
    - mask
    - default-when-null
    - date-add
    - regexp-extract
    - uppercase
    - lowercase
    - replace
    - round
    - truncate
    - date-trunc
    - null-to-empty
    - empty-to-null
    - normalize-unicode
    - pad
    - left
    - right
    - split-part
    - coalesce-blank
    - drop
  derived:
    - concat
    - coalesce
    - case-when
    - arithmetic
    - cast-as
    - md5
  structural:
    - add-column
    - drop-column
    - rename-column
    - set-default
  set:
    - deduplicate
    - distinct
    - filter
    - top-n
  cardinality:
    - merge
    - split
  relational:
    - denormalise
    - normalise


# ---------------------------------------------------------------------------
# The operation vocabularies
# ---------------------------------------------------------------------------

# Column recipes that rewrite one expression into another. Read by the
# projection loop to tell a column-level value step (already applied where the
# column is read) from one that must be applied to a working column.
value_ops:
  - cast
  - trim
  - substring
  - mask
  - default-when-null
  - date-add
  - regexp-extract
  - uppercase
  - lowercase
  - replace
  - round
  - truncate
  - date-trunc
  - null-to-empty
  - empty-to-null
  - normalize-unicode
  - pad
  - left
  - right
  - split-part
  - coalesce-blank

# Recipes that build a column out of more than one input. `_validate_step`
# also requires at least two inputs for the multi-input ones.
derived_ops:
  - concat
  - coalesce
  - case-when
  - arithmetic
  - cast-as
  - md5

# The operations that remove a value or a column. Read wherever a removal has
# to be recognised on its own: the projection loop, and the sensitive-handling
# check that proves a declared `drop` is actually delivered.
drop_ops:
  - drop

# Table-shaping operations that add, remove, rename or default a column
# rather than computing one.
structural_ops:
  - add-column
  - drop-column
  - rename-column
  - set-default


# ---------------------------------------------------------------------------
# Categories with a special job
# ---------------------------------------------------------------------------

# Categories that make a job snapshot-only rather than CDC-capable: their
# result is a relation shape a change stream cannot carry forward.
snapshot_only_categories:
  - set
  - relational
  - pivot

# Categories compiled outside the projection pass -- they shape the source
# relation, a join or a filter rather than adding a column, so the projection
# loop skips them instead of rejecting them as unhandled.
elsewhere_handled_categories:
  - row-selection
  - lookup
  - set
  - cardinality
  - relational
  - pivot


# ---------------------------------------------------------------------------
# What the compilers accept
# ---------------------------------------------------------------------------

# Row-selection comparisons, mapped to SQL. `is-null` is accepted alongside
# these and needs no mapping. An unknown comparison blocks before compilation
# (PREDICATE_COMPARISON_UNKNOWN).
predicate_operators:
  eq: "="
  ne: "<>"
  gt: ">"
  ge: ">="
  lt: "<"
  le: "<="

# The arithmetic operators an `arithmetic` derived step may name, mapped to
# SQL. An unknown one blocks (STEP_ARITHMETIC_OPERATOR_UNKNOWN).
arithmetic_operators:
  add: "+"
  subtract: "-"
  multiply: "*"
  divide: "/"
  modulo: "%"

# Aggregate functions the pivot compiler accepts, mapped to SQL. An unknown
# one blocks (STEP_PIVOT_AGGREGATE_UNKNOWN) rather than being emitted as a
# call Oracle would answer differently.
pivot_aggregates:
  sum: "SUM"
  min: "MIN"
  max: "MAX"
  count: "COUNT"
  count-distinct: "COUNT(DISTINCT {expr})"
  avg: "AVG"
  avg-distinct: "AVG(DISTINCT {expr})"
  listagg: "LISTAGG"
  string-agg: "STRING_AGG"

# Join types the denormalise compiler accepts, mapped to SQL. An unknown one
# blocks (STEP_JOIN_TYPE_UNKNOWN); the synonyms exist because the
# specification allows both spellings and PostgreSQL has only one.
join_types:
  inner: "INNER JOIN"
  left: "LEFT JOIN"
  left-outer: "LEFT JOIN"
  right: "RIGHT JOIN"
  right-outer: "RIGHT JOIN"
  full: "FULL JOIN"
  full-outer: "FULL JOIN"
  cross: "CROSS JOIN"


# ---------------------------------------------------------------------------
# The two engines
# ---------------------------------------------------------------------------

# Oracle -> PostgreSQL base type names. Precision, scale and timezone suffixes
# are appended by oracle_type_to_pg rather than being listed here, so a type
# this map does not know becomes `text` plus a note in the artifact instead of
# a guessed target type.
oracle_to_pg:
  NUMBER: numeric
  NUMERIC: numeric
  DECIMAL: numeric
  DEC: numeric
  INTEGER: integer
  INT: integer
  SMALLINT: smallint
  FLOAT: double precision
  BINARY_FLOAT: real
  BINARY_DOUBLE: double precision
  DOUBLE PRECISION: double precision
  REAL: real
  VARCHAR: character varying
  VARCHAR2: character varying
  NVARCHAR2: character varying
  STRING: character varying
  CHAR: character
  NCHAR: character
  CHARACTER: character
  CLOB: text
  NCLOB: text
  LONG: text
  LONG RAW: bytea
  RAW: bytea
  BLOB: bytea
  IMAGE: bytea
  DATE: date
  TIMESTAMP: timestamp
  TIMESTAMP WITH TIME ZONE: timestamptz
  TIMESTAMP WITH LOCAL TIME ZONE: timestamptz
  INTERVAL: interval
  INTERVAL YEAR TO MONTH: interval
  INTERVAL DAY TO SECOND: interval
  ROWID: text
  UROWID: text
  XMLTYPE: xml
  JSON: jsonb
  BOOLEAN: boolean

# PostgreSQL reserved and special words. `naming.onReservedOrSpecial: quote`
# quotes these rather than renaming them, because the approved contract names
# the object. Quoted in this file because unquoted `on`, `true`, `false` and
# `null` are YAML booleans and null, not the words.
pg_reserved_words:
  - "all"
  - "analyse"
  - "analyze"
  - "and"
  - "any"
  - "array"
  - "as"
  - "asc"
