# ---------------------------------------------------------------------------
# The DuckDB validation dialect
# ---------------------------------------------------------------------------

# Oracle function names DuckDB has no scalar function for, verified against
# DuckDB rather than assumed. `_duckdb_rewrite` rewrites the ones it can
# express; anything still present after the rewrite is reported against this
# list and blocks (DUCKDB_ORACLE_FUNCTION_LEFT), which is what makes the
# rewrite table trustworthy instead of merely believed complete.
duckdb_unbindable_oracle_functions:
  - ADD_MONTHS
  - CONNECT_BY_ROOT
  - CURRENT_DATE_BEFORE
  - DECODE
  - MODEL
  - NEXT_DAY
  - NVL
  - REGEXP_INSTR
  - REGEXP_SUBSTR
  - SELF_TO_CURRENCY_CONV
  - STANDARD_HASH
  - SYSDATE
  - SYSTIMESTAMP
  - TO_BINARY_DOUBLE
  - TO_CHAR
  - TO_CLOB
  - TO_DATE
  - TO_DSINTERVAL
  - TO_MULTI_BYTE
  - TO_NCHAR
  - TO_NUMBER
  - TO_TIMESTAMP
  - TRANSLATE_USING
  - XMLQUERY
  - XMLTABLE

# STANDARD_HASH algorithms DuckDB can express, each executed against DuckDB
# before being listed. An algorithm not here cannot be translated, so a
# `mask strategy=hash` naming it blocks rather than shipping a plan that fails
# when the mask is first computed.
duckdb_hash_by_oracle_algorithm:
  MD5: MD5
  SHA1: SHA1
  SHA-1: SHA1
  SHA256: SHA256
  SHA-256: SHA256
