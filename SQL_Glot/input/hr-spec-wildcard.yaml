specVersion: 1
schemaVersion: 5.1.0
dictionaryVersion: 1

engines:
  source:
    engine: oracle
    version: 26ai
  target:
    engine: postgresql
    version: "17"

scope:
  include:
    - objectClass: table
      schema: HR
      name: EMPLOYEES

defaults:
  emptyStringIsNull: "null"
  charLengthSemantics: characters
  collation: binary
  numberWithoutPrecision: from-profile
  dateWithTimeComponent: date-if-profile-proves-no-time
  timestampWithTimeZone: split-offset
  fractionalSecondsBeyondMicroseconds: round
  json: jsonb

acceptance:
  checks:
    - row-count-exact
    - chunk-digest-match
  maxQuarantinedRows: 0

run:
  shape: migration
  acquisition: snapshot
  processing: bounded
  rerun: replace-scope

naming:
  schema:
    policy: map
    map:
      - source: HR
        target: public
  case: lower
  onReservedOrSpecial: quote
  onTooLong: shorten-with-hash
  packageMembers: prefix

rules:
  - id: employees-table

    match:
      objectClass: table
      schema: HR
      name: EMPLOYEES

    target:
      schema: public
      table: employees

    columns:

      - name: EMPLOYEE_ID
        type: "NUMBER(10)"
        nullable: false

      - name: FIRST_NAME
        type: "VARCHAR2(50)"
        nullable: false

      - name: LAST_NAME
        type: "VARCHAR2(50)"
        nullable: false

      - name: EMAIL
        type: "VARCHAR2(100)"

      - name: SALARY
        type: "NUMBER(12,2)"

      - name: HIRE_DATE
        type: "DATE"
        nullable: false

      - name: EMPLOYEE_STATUS
        type: "CHAR(1)"

      - name: IS_MANAGER
        type: "NUMBER(1)"

      - name: DEPARTMENT_CODE
        type: "VARCHAR2(10)"

    primaryKey:
      - EMPLOYEE_ID

    conversions:

      - column: EMPLOYEE_ID
        targetType: bigint

      - column: FIRST_NAME
        targetType: varchar(50)
        transform: trim

      - column: LAST_NAME
        targetType: varchar(50)
        transform: trim

      - column: EMAIL
        targetType: varchar(100)
        transform: lowercase
        nullIf:
          - ""

      - column: SALARY
        targetType: numeric(12,2)
        transform: round

      - column: HIRE_DATE
        targetType: date

      - column: EMPLOYEE_STATUS
        targetType: varchar(20)
        transform:
          map:
            A: ACTIVE
            I: INACTIVE
            T: TERMINATED

      - column: IS_MANAGER
        targetType: boolean
        transform:
          map:
            1: true
            0: false
        onInvalid: quarantine

      - column: DEPARTMENT_CODE
        targetType: varchar(10)
        transform: trim
        nullIf:
          - ""

dataConversion:
  - id: employee-status
    source:
      column: EMPLOYEE_STATUS
      type: "CHAR(1)"
    target:
      column: employee_status
      type: varchar(20)
    mapping:
      A: ACTIVE
      I: INACTIVE
      T: TERMINATED
    onUnmapped: quarantine

  - id: manager-flag
    source:
      column: IS_MANAGER
      type: "NUMBER(1)"
    target:
      column: is_manager
      type: boolean
    mapping:
      1: true
      0: false
    onUnmapped: quarantine

  - id: salary-normalization
    source:
      column: SALARY
      type: "NUMBER(12,2)"
    target:
      column: salary
      type: numeric(12,2)
    transform:
      roundScale: 2
    onInvalid: quarantine

  - id: email-normalization
    source:
      column: EMAIL
      type: "VARCHAR2(100)"
    target:
      column: email
      type: varchar(100)
    transform:
      - trim
      - lowercase
    emptyValue: null

validation:
  - id: employee-id-not-null
    column: EMPLOYEE_ID
    check: not-null

  - id: salary-range
    column: SALARY
    check:
      between:
        min: 0
        max: 9999999999.99
    onFailure: quarantine

  - id: valid-status
    column: EMPLOYEE_STATUS
    check:
      in:
        - A
        - I
        - T
    onFailure: quarantine

  - id: valid-manager-flag
    column: IS_MANAGER
    check:
      in:
        - 0
        - 1
    onFailure: quarantine
