# agents.yaml — the multi-agent process for this project
#
# Three agents, two stages. Stage 1 runs the two build agents **in parallel**;
# they own disjoint files, so neither can clobber the other. Stage 2 runs the
# verifier once both are done, because it needs both the service and the
# dynamic rulebook to exist before it can check anything.
#
#     +-----------+   +------------+
#     | api-agent |   | rules-agent|     stage 1, parallel
#     +-----+-----+   +-----+------+
#           |               |
#           +-------+-------+
#                   v
#             +-----+------+
#             | verify-agent|           stage 2, after both
#             +------------+
#
# `depends_on` is the whole dependency graph. Nothing else orders the work.
# The orchestrator starts a process by spawning each agent with no unfinished
# dependencies and then following the edges.

process: migration-transpiler-service
version: 1

environment:
  project_root: .
  python: C:\Users\vikik\AppData\Local\Programs\Python\Python312\python.exe
  notes:
    - "The `python` on PATH (D:\\Scripts\\python.exe) is a broken venv shim
       (pyvenv.cfg missing). Every command must use `python` below by full path."
    - "Baseline recorded before the process started: --self-test 35/35 PASS,
       input/migration-spec.yaml compiles exit 0, input/hr-spec-wildcard.yaml
       + input/catalog_orders_wildcard.yaml compiles exit 0."
    - "Run every command with working directory = project_root."

stages:
  - name: build
    mode: parallel
    agents: [api-agent, rules-agent]
  - name: prove
    mode: sequential
    agents: [verify-agent]

agents:
  # ---------------------------------------------------------------------
  - id: api-agent
    role: FastAPI service for the transpiler
    stage: build
    depends_on: []
    owns:
      - src/api.py              # new file
      - requirements.txt        # update
    forbidden:
      - src/transpiler.py       # owned by rules-agent, do not edit
      - config/rules.yaml       # owned by rules-agent, do not create or edit
      - AGENT.md / README.md    # out of scope for this process

    work:
      - id: route
        task: >
          Create src/api.py: a FastAPI app exposing the transpiler over HTTP.
          Routes:
            GET  /health    -> {status, tool, version} (import TOOL_NAME /
                               TOOL_VERSION from transpiler).
            POST /transpile -> multipart form with TWO file inputs:
                               `spec` (the migration specification YAML,
                               required) and `catalog` (the Oracle source
                               schema catalog YAML, optional - a spec that
                               states its own columns needs none, but wildcard
                               scope does). Optional form field `spec_name`
                               overrides the spec's display name.
            GET  /rules     -> the active rulebook as JSON. Call
                               transpiler.active_rules() when that function
                               exists (rules-agent provides it); otherwise fall
                               back to exporting the module's vocabulary
                               constants. Must never raise 500 when the
                               rulebook is default.
        details:
          - "sys.path.insert(0, str(Path(__file__).parent)) then `import
             transpiler`, so it works both as `uvicorn src.api:app` from the
             project root and as `python src/api.py`."
          - "Per request: make a private temp workspace (tempfile.mkdtemp),
             write the uploaded spec (sanitised filename, default spec.yaml)
             and the catalog (catalog.yaml beside the spec) into it, then call
             transpiler.main(['--spec', ..., '--catalog', ..., '--output-dir',
             ...]) - explicit --catalog so the upload wins over any search."
          - "transpiler.main is CPU-bound and prints a receipt: run it inside
             starlette.concurrency.run_in_threadpool and capture stdout/stderr
             with contextlib.redirect_stdout / redirect_stderr into a string."
          - "Read the two generated artifacts (seatunnel.conf, duckdb.yaml)
             back into the response, then delete the temp workspace. One
             request can never see another's files."
          - "Response: {ok, exit_code, receipt, artifacts: [{name, bytes,
             content}], error?}. Map exit codes: 0 -> 200; 2 -> 422 (spec could
             not be read - quote the SpecReadError message); 1 -> 500 (a
             generated file failed re-validation)."
          - "Attach __main__ guard: uvicorn.run('src.api:app', ...) so
             `python src/api.py` starts the server on port 8000."
      - id: requirements
        task: >
          Update requirements.txt: keep PyYAML and sqlglot and every existing
          comment exactly as they are, and append fastapi, uvicorn[standard]
          and python-multipart with a one-line comment each (multipart is what
          /transpile's file upload needs).

    acceptance:
      - "`python -c \"import src.api\"` from project root succeeds."
      - "requirements.txt still documents PyYAML and sqlglot, and now lists
         fastapi, uvicorn[standard], python-multipart."
      - "src/transpiler.py is byte-for-byte unchanged by this agent."
      - "No new dependency on files owned by other agents beyond the
         defensive GET /rules fallback described above."

  # ---------------------------------------------------------------------
  - id: rules-agent
    role: dynamic rulebook (no hardcoded rule vocabularies)
    stage: build
    depends_on: []
    owns:
      - src/transpiler.py       # edit
      - config/rules.yaml       # new file
    forbidden:
      - src/api.py              # owned by api-agent, do not edit
      - requirements.txt        # owned by api-agent, do not edit
      - AGENT.md / README.md    # out of scope for this process

    work:
      - id: audit
        task: >
          Audit src/transpiler.py for rule vocabularies hardcoded in code.
          Known set (grep confirms): SUPPORTED_SCHEMA_VERSIONS, VALUE_OPS,
          DERIVED_OPS, DROP_OPS, STRUCTURAL_OPS, KNOWN_CATEGORIES, the
          per-category allowed-operations mapping inside _validate_step
          (value/derived/structural/set/cardinality/relational),
          PREDICATE_OPERATORS, ARITHMETIC_OPERATORS, PIVOT_AGGREGATES,
          JOIN_TYPES, ORACLE_TO_PG, PG_RESERVED_WORDS. Confirm the list and
          note every read site.
      - id: externalise
        task: >
          Move those vocabularies into config/rules.yaml - one YAML file that
          is the rulebook a deployment actually ships. Structure: a top-level
          key per vocabulary, plus `categories:` mapping each category to its
          allowed operations (preserving today's exact membership, including
          that `value` allows `drop`). Comment each section with what it
          governs. Values must reproduce today's behaviour byte-for-byte.
      - id: load
        task: >
          Load the rulebook dynamically at startup: TRANSPILER_RULES_FILE env
          var wins, else PROJECT_ROOT/config/rules.yaml when present, else the
          built-in defaults (kept as the fallback so a deleted config does not
          crash the tool). Validate shape and types on load: a config file that
          exists but is malformed or has the wrong type for a key must raise a
          clear, named error - never silently fall back. The project's own
          rule (AGENT.md: a stale hand-written list silently governing a
          migration is worse than a redundant one) applies to rulebooks too.
          Read sites consult the loaded rulebook at runtime; the constant
          names may remain as the built-in defaults they fall back to.
      - id: expose
        task: >
          Expose `active_rules() -> dict` returning the loaded rulebook as
          plain JSON-safe data (sets -> sorted lists) so the API's GET /rules
          can serve it. This is the only symbol other agents may import.
      - id: prove
        task: >
          Add regression coverage in self_test(): (a) the default rulebook
          still drives an existing path, (b) an override loaded from a
          temporary rules file changes validation - e.g. removing an operation
          from a category makes a step that uses it BLOCK instead of compile,
          (c) a malformed rules file raises the named error. Assert on SQL or
          diagnostic codes, not just "it compiled".

    acceptance:
      - "`python src\transpiler.py --self-test` passes every case, including
         the pre-existing 35 and the new dynamic-rulebook ones."
      - "With config/rules.yaml present, `python src\transpiler.py` on
         input/migration-spec.yaml and on input/hr-spec-wildcard.yaml
         (with its catalog) both exit 0 and write both artifacts."
      - "With config/rules.yaml temporarily renamed, the same runs still exit
         0 (built-in fallback)."
      - "No rule id, table name or specification-specific value is
         special-cased anywhere - the compiler still reads the specification,
         it does not know any table by name."

  # ---------------------------------------------------------------------
  - id: verify-agent
    role: end-to-end output verification
    stage: prove
    depends_on: [api-agent, rules-agent]
    owns: []
    forbidden:
      - src/transpiler.py
      - src/api.py
      - config/rules.yaml
      - requirements.txt

    work:
      - id: install
        task: "pip install -r requirements.txt into the project python."
      - id: cli
        task: >
          Run the CLI exactly as AGENT.md section 10 describes:
          --self-test (all PASS), then compile input/migration-spec.yaml and
          input/hr-spec-wildcard.yaml + input/catalog_orders_wildcard.yaml.
          Assert exit 0, both output/<spec>/{seatunnel.conf, duckdb.yaml}
          exist and are non-empty, duckdb.yaml round-trips through
          yaml.safe_load, and seatunnel.conf contains job { blocks.
      - id: api
        task: >
          Start `python -m uvicorn src.api:app --port 8000` in the background,
          then: GET /health == 200; POST /transpile with the two real input
          files (input/hr-spec-wildcard.yaml as `spec`,
          input/catalog_orders_wildcard.yaml as `catalog`) must return 200
          with exit_code 0 and both artifacts non-empty; POST a malformed spec
          must return 422 (not a traceback); GET /rules returns JSON.
          Stop the server afterwards.
      - id: report
        task: >
          Write the findings as the agent's final answer: what was checked,
          what passed, what failed with exact evidence (status codes, exit
          codes, file sizes).

    acceptance:
      - "Every CLI and HTTP check above is executed, not assumed."
      - "Failures are reported with evidence; nothing is papered over."
